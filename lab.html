<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Server Doctor / Live Customer Lab</title>
<style>body{font:15px system-ui;background:#0c1220;color:#e6edf8;margin:0;padding:32px}main{max-width:1400px;margin:auto}h1{font-size:36px}#customers{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}article{background:#172238;padding:20px;border-radius:12px;border-top:4px solid #72cead}article.alert{border-color:#ff866e}a{color:#a3c6ff}pre{white-space:pre-wrap;font:12px monospace}small,p{color:#bdcbe1}#status{padding:16px;background:#253859;margin-bottom:24px;border-radius:10px}</style>
<main><small>SERVER DOCTOR / REAL HTTP / LOCAL CUSTOMERS</small><h1>Eight customers. Two opinions.</h1><p>Seven legitimate workloads and one controlled overload. Fictional sites, actual HTTP traffic and persisted ETL. Observation only.</p><div id="status">Connecting...</div><div id="customers"></div><h2>Acceptance checks</h2><pre id="checks">Running...</pre></main>
<script>
async function refresh(){try{const s=await(await fetch('/api/lab')).json();document.querySelector('#status').textContent=`${s.phase.toUpperCase()} · ${s.elapsedSeconds}s · ${s.finished?'Traffic generation finished; websites remain available':'Live requests → proxy → agents → JSONL → ETL'}`;
document.querySelector('#customers').replaceChildren(...s.customers.map(c=>{const a=document.createElement('article');if(c.review?.verdict==='escalate')a.className='alert';const h=document.createElement('h2');h.textContent=c.name;const link=document.createElement('a');link.href=c.url;link.target='_blank';link.rel='noreferrer';link.textContent='Open customer website';const p=document.createElement('p');p.textContent=c.profile;const v=document.createElement('pre');const outcome=s.report?.results.find(r=>r.id===c.id);v.textContent=JSON.stringify({requests:c.completed,statuses:c.statuses,worker:c.pulse.proposal.type,reviewer:c.review?.verdict,diagnosis:c.review?.diagnosis,reasons:c.review?.reasons,model:c.pulse.model.status,etlSnapshots:c.etl?.hours.reduce((n,h)=>n+h.reviewedSamples,0)||0,testOutcome:outcome?{incidentDetected:outcome.reviewerEscalated,detectionDelayMs:outcome.detectionDelayMs,recovered:outcome.recovered,verifiedByStoredReplay:outcome.persistedReplayEscalated}:null},null,2);a.append(h,link,p,v);return a;}));document.querySelector('#checks').textContent=JSON.stringify(s.report?{passed:s.report.passed,checks:s.report.checks,scope:s.report.scope}:'Waiting for baseline, burst and recovery phases',null,2);}catch{document.querySelector('#status').textContent='Lab disconnected';}}refresh();setInterval(refresh,1000);
</script></html>
